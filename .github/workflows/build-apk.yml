name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Build Environment
        run: |
          # Ensure google-services.json exists and matches the package name: com.example.frfxjv
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"315963306836","project_id":"gen-lang-client-0400861689","storage_bucket":"gen-lang-client-0400861689.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:315963306836:android:d126a2ac3369cf7c564ec1","android_client_info":{"package_name":"com.example.frfxjv"}},"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
          fi

          # Environment configuration for secrets plugin
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # Handle Debug Keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            # Generate a new debug keystore if missing
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Fix gradlew permissions and line endings (CRLF to LF)
          sed -i 's/\r$//' gradlew
          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --info --no-daemon

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CGPI-Routine-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
